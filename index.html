<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pronunciation Mystery Picture</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f7fa;
      padding: 40px;
    }

    h1 {
      color: #2c3e50;
    }

    .game-box {
      background-color: white;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .word {
      font-size: 42px;
      font-weight: bold;
      margin: 30px 0;
      color: #34495e;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .listen-button {
      background-color: #3498db;
      color: white;
    }

    .speak-button {
      background-color: #2ecc71;
      color: white;
    }

    .picture-box {
  position: relative;
  width: 100%;
  height: 350px;
  margin-top: 30px;
  border-radius: 15px;
  overflow: hidden;
}

.mystery-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cover-grid {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(4, 1fr);
}

.cover {
  background-color: #34495e;
  border: 2px solid white;
  box-sizing: border-box;
  transition: opacity 0.6s ease;
}

.cover.revealed {
  opacity: 0;
}

  </style>
</head>


<body>

  <div class="game-box">

    <h1>🎤 Pronunciation Mystery Picture</h1>

    <p>Read the word aloud to reveal the mystery picture!</p>

    <div class="word" id="wordDisplay">
  popular
</div>

    <button class="listen-button" onclick="speakWord()">
      🔊 Listen
    </button>

    <button class="speak-button" onclick="startListening()">
  🎤 Say the Word
    </button>

    <p id="result"></p>

    <div class="picture-box">

  <img src="mystery.jpg" class="mystery-image">

  <div class="cover-grid">

    <!-- 第1行：6格 -->
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>

    <!-- 第2行：6格 -->
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>

    <!-- 第3行：6格 -->
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>

    <!-- 第4行：6格 -->
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>
    <div class="cover"></div>

  </div>

</div>

  </div>

 <script>

  const words = [
    "popular",
    "travel",
    "culture",
    "snack",
    "local",
    "special",
    "picture",
    "market",
    "family",
    "country",
    "people",
    "student",
    "teacher",
    "English",
    "school",
    "friend",
    "music",
    "movie",
    "happy",
    "summer",
    "beautiful",
    "interesting",
    "different",
    "favorite"
  ];

  let currentWordIndex = 0;
// 24格的隨機揭開順序
const revealOrder = Array.from({ length: 24 }, (_, i) => i);

// 洗牌
for (let i = revealOrder.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));

  [revealOrder[i], revealOrder[j]] =
    [revealOrder[j], revealOrder[i]];
}

  
  // 🔊 播放單字發音
  function speakWord() {
    const word = words[currentWordIndex];

    const speech = new SpeechSynthesisUtterance(word);
    speech.lang = "en-US";
    speech.rate = 0.8;

    window.speechSynthesis.speak(speech);
  }


  // 🎤 開始語音辨識
  function startListening() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById("result").textContent =
        "Sorry, your browser does not support speech recognition.";
      return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;


    // 開始聆聽
    recognition.onstart = function() {

      document.getElementById("result").textContent =
        "🎤 Listening...";

    };


    // 收到辨識結果
   recognition.onresult = function(event) {

  const spokenWord =
    event.results[0][0].transcript
      .toLowerCase()
      .trim();

  const targetWord = words[currentWordIndex].toLowerCase();

 if (spokenWord === targetWord) {

  document.getElementById("result").innerHTML =
    "✅ Correct!<br>You said: " + spokenWord;

  // 找到24個遮罩
const covers = document.querySelectorAll(".cover");

// 找出這一題要揭開的隨機格子
const tileIndex = revealOrder[currentWordIndex];

// 揭開這一格
covers[tileIndex].classList.add("revealed");

// 前往下一個單字
currentWordIndex++;
  // 如果還有下一題
  if (currentWordIndex < words.length) {

    setTimeout(function() {

      document.getElementById("wordDisplay").textContent =
        words[currentWordIndex];

      document.getElementById("result").textContent = "";

    }, 1000);

  } else {

    // 24題全部完成
    setTimeout(function() {

      document.getElementById("wordDisplay").textContent =
        "🎉 Congratulations!";

      document.getElementById("result").innerHTML =
        "You completed all 24 words!";

    }, 1000);

  }

} else {

  document.getElementById("result").innerHTML =
    "❌ Try again!<br>You said: " + spokenWord;

}
  
};


    // 發生錯誤
    recognition.onerror = function(event) {

  document.getElementById("result").textContent =
    "Error: " + event.error;

};


    recognition.start();

  }

</script>
 
</body>

</html>
