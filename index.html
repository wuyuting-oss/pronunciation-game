<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pronunciation Mystery Picture</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f7fa;
      padding: 40px;
    }

    h1 {
      color: #2c3e50;
    }

    .game-box {
      background-color: white;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .word {
      font-size: 42px;
      font-weight: bold;
      margin: 30px 0;
      color: #34495e;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .listen-button {
      background-color: #3498db;
      color: white;
    }

    .speak-button {
      background-color: #2ecc71;
      color: white;
    }

    .picture-box {
      margin-top: 30px;
      height: 250px;
      background-color: #dfe6e9;
      border-radius: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #636e72;
      font-size: 20px;
    }

  </style>
</head>


<body>

  <div class="game-box">

    <h1>🎤 Pronunciation Mystery Picture</h1>

    <p>Read the word aloud to reveal the mystery picture!</p>

    <div class="word">
      popular
    </div>

    <button class="listen-button">
      🔊 Listen
    </button>

    <button class="speak-button">
      🎤 Say the Word
    </button>

    <div class="picture-box">
      Mystery Picture
    </div>

  </div>

</body>

</html>
